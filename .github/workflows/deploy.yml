name: Build and deploy to Netlify

# Builds the site on GitHub's runners (free) and uploads the prebuilt dist to
# Netlify via the CLI. This is an API deploy, so it does NOT use Netlify build
# minutes. Disable Netlify's own continuous deployment so pushes don't also
# trigger a Netlify build (see README / repo notes).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # PUBLIC_SLACK_WEBHOOK_URL is baked into the client bundle at build time
      # (it lives in the gitignored .env locally). Without it the booking-lead
      # Slack notifications silently no-op.
      - run: npm run build
        env:
          PUBLIC_SLACK_WEBHOOK_URL: ${{ secrets.PUBLIC_SLACK_WEBHOOK_URL }}

      - name: Deploy dist to Netlify
        run: npx --yes netlify-cli@17 deploy --prod --dir=dist --message "GH Actions ${GITHUB_SHA::7}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
